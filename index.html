<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2 class="mb-4 text-center">Conversor</h2>
    <form id="conversionForm" novalidate>
        <div class="row mb-3">
            <div class="col">
                <label for="km" class="form-label">Kilometros (km):</label>
                <input type="number" class="form-control" id="km" min="0" placeholder="Ej: 1">
            </div>
            <div class="col">
                <label for="m" class="form-label">Metros (m):</label>
                <input type="number" class="form-control" id="m" min="0" placeholder="Ej: 1">
            </div>
        </div>

        <div class="row mb-3">
            <div class="col">
                <label for="ft" class="form-label">Pies (ft):</label>
                <input type="number" class="form-control" id="ft" min="0" placeholder="Ej: 1">
            </div>
            <div class="col">
                <label for="yarda" class="form-label">Yardas:</label>
                <input type="number" class="form-control" id="yarda" min="0" placeholder="Ej: 1">
            </div>
        </div>

        <div class="mb-3 d-flex gap-2">
            <button type="button" class="btn btn-primary" onclick="calcularConversion()">Calcular</button>
            <button type="reset" class="btn btn-secondary" onclick="limpiarCampos()">Limpiar</button>
        </div>
    </form>
</div>
    <script src="index.js"></script>
</body>
</html>
